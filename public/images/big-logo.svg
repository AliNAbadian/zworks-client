    y="430"
    fill="#FFFFFF"
    font-family="Arial Black, Arial, sans-serif"
    font-size="78"
    font-weight="900"
    letter-spacing="10"
    text-anchor="middle"
  >
    MARS
  </text>

  <line x1="150" y1="468" x2="210" y2="468" stroke="#C1440E" stroke-width="2.5"/>
  <text
    x="270"
    y="476"
    fill="#FFFFFF"
    font-family="Arial, sans-serif"
    font-size="24"
    font-weight="600"
    letter-spacing="8"
    text-anchor="middle"
  >
    AGENCY
  </text>
  <line x1="330" y1="468" x2="390" y2="468" stroke="#C1440E" stroke-width="2.5"/>

  <text
    x="270"
    y="590"
    fill="#FFFFFF"
    font-family="Tahoma, Arial, sans-serif"
    font-size="54"
    font-weight="700"
    text-anchor="middle"
  >
    &#x645;&#x627;&#x631;&#x633;
  </text>
</svg>
