<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680" fill="none" role="img" aria-label="Mars Agency - Mars">
  <defs>
    <radialGradient id="planet-base" cx="0.38" cy="0.32" r="0.72">
      <stop offset="0%" stop-color="#F0884A"/>
      <stop offset="42%" stop-color="#D25A23"/>
      <stop offset="100%" stop-color="#6B2808"/>
    </radialGradient>
    <radialGradient id="planet-shine" cx="0.32" cy="0.24" r="0.45">
      <stop offset="0%" stop-color="#FFD0B0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD0B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C1440E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C1440E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swoosh-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="270" cy="205" rx="178" ry="178" fill="url(#planet-glow)"/>

  <g transform="translate(270 205)">
    <circle r="132" fill="url(#planet-base)"/>
    <circle r="132" fill="url(#planet-shine)"/>

    <ellipse cx="-34" cy="-28" rx="34" ry="28" fill="#8B3010" opacity="0.55"/>
    <ellipse cx="42" cy="18" rx="26" ry="22" fill="#8B3010" opacity="0.42"/>
    <ellipse cx="-8" cy="52" rx="44" ry="20" fill="#A03810" opacity="0.34"/>
    <circle cx="48" cy="-36" r="14" fill="#D25A23" opacity="0.5"/>
    <circle cx="-58" cy="24" r="10" fill="#E8734A" opacity="0.45"/>
    <circle cx="62" cy="46" r="8" fill="#D25A23" opacity="0.38"/>

    <path
      d="M-92 18 C-42 2, 18 -8, 92 6"
      stroke="url(#swoosh-fade)"
      stroke-linecap="round"
      stroke-width="10"
    />
    <path
      d="M-88 42 C-36 28, 24 18, 96 30"
      stroke="url(#swoosh-fade)"
      stroke-linecap="round"
      stroke-width="10"
    />
  </g>

  <text
